<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>География 9 класс — ADVANCED</title>
<style>
body {
    font-family: Arial;
    background: #f0f8ff;
    padding: 20px;
}
.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    max-width: 750px;
    margin: auto;
}
button {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    font-size: 16px;
}
.timer {
    color: red;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
<h2>География 9 класс — ADVANCED</h2>
<p id="question"></p>
<div id="answers"></div>
<p class="timer">Время: <span id="time">25</span> сек</p>
</div>

<script>
const questions = [
{q:"Самая глубокая точка Мирового океана?",a:["Марианская впадина","Тонгариро","Трансильванская впадина","Залив Худ"],c:0},
{q:"Какой материк содержит наибольшее число вулканов?",a:["Африка","Южная Америка","Азия","Океания"],c:2},
{q:"Какая страна имеет наибольшую береговую линию?",a:["Канада","Россия","Австралия","США"],c:0},
{q:"Самая высокая активная вулканическая гора Европы?",a:["Этна","Везувий","Монблан","Килиманджаро"],c:0},
{q:"Какая пустыня считается самой сухой?",a:["Сахара","Гоби","Атакама","Калахари"],c:2},
{q:"Какой океан самый мелкий?",a:["Северный Ледовитый","Атлантический","Индийский","Тихий"],c:0},
{q:"Самый крупный остров в мире?",a:["Гренландия","Новая Гвинея","Борнео","Мадагаскар"],c:0},
{q:"Река с наибольшей средней годовой водностью?",a:["Амазонка","Нил","Янцзы","Миссисипи"],c:0},
{q:"Какая страна имеет наибольший континентальный шельф?",a:["США","Канада","Австралия","Россия"],c:2},
{q:"Самая длинная горная система в мире?",a:["Альпы","Анды","Гималаи","Кавказ"],c:1},

{q:"Самый высокий водопад мира?",a:["Анхель","Ниагара","Виктория","Игуасу"],c:0},
{q:"Какой климатический пояс занимает наибольшую площадь Земли?",a:["Умеренный","Тропический","Полярный","Субтропический"],c:1},
{q:"Самый высокий активный вулкан в мире?",a:["Охос-дель-Саладо","Этна","Фудзияма","Котопакси"],c:0},
{q:"Какая страна полностью находится в тропическом поясе?",a:["Кения","Италия","США","Индия"],c:0},
{q:"Какая страна имеет наибольший запас пресной воды?",a:["Россия","Бразилия","Канада","Китай"],c:2},
{q:"Самый большой коралловый риф?",a:["Большой Барьерный риф","Флорида","Мальдивы","Ямайка"],c:0},
{q:"Какая пустыня является холодной?",a:["Сахара","Гоби","Калахари","Атакама"],c:1},
{q:"На каком материке находится озеро Виктория?",a:["Африка","Южная Америка","Азия","Австралия"],c:0},
{q:"Какая страна имеет наибольшее количество озёр?",a:["Канада","Россия","США","Финляндия"],c:0},
{q:"Самая северная столица мира?",a:["Рейкьявик","Хельсинки","Осло","Стокгольм"],c:0},

{q:"Самая высокая точка Африки?",a:["Килиманджаро","Эльбрус","Аконкагуа","Кайлас"],c:0},
{q:"Какой океан омывает восточные берега Африки?",a:["Индийский","Атлантический","Тихий","Северный Ледовитый"],c:0},
{q:"Какая страна полностью состоит из архипелага?",a:["Япония","Италия","Испания","Чили"],c:0},
{q:"Какой материк имеет наибольшую протяжённость по долготе?",a:["Африка","Азия","Южная Америка","Северная Америка"],c:1},
{q:"Самый крупный полуостров в мире?",a:["Аравийский","Скандинавский","Индокитай","Лабрадор"],c:0},
{q:"Наибольшая площадь болот находится в?",a:["Канада","Россия","Бразилия","Индонезия"],c:1},
{q:"Самая холодная обитаемая точка Земли?",a:["Оймякон","Восток (Антарктида)","Новый Сад","Барроу"],c:0},
{q:"Самое большое солёное озеро мира?",a:["Каспийское","Аральское","Мёртвое","Виктория"],c:0},
{q:"Какая страна является крупнейшим экспортером нефти?",a:["Саудовская Аравия","Россия","США","Иран"],c:0},
{q:"Какая страна не имеет выхода к морю?",a:["Швейцария","Италия","Франция","Испания"],c:0},

{q:"На каком материке больше всего вулканов?",a:["Африка","Азия","Южная Америка","Океания"],c:1},
{q:"Самая длинная река России?",a:["Лена","Волга","Енисей","Обь"],c:1},
{q:"Какая страна самая большая по площади в Европе?",a:["Россия","Франция","Украина","Испания"],c:0},
{q:"Какая страна имеет наибольшую численность населения в Европе?",a:["Германия","Россия","Франция","Великобритания"],c:0},
{q:"Какой материк является родиной бананов?",a:["Африка","Южная Америка","Азия","Океания"],c:1},
{q:"На какой широте проходит экватор?",a:["0°","23° с.ш.","66° с.ш.","45° с.ш."],c:0},
{q:"Какой океан соединён с Атлантическим через Гибралтарский пролив?",a:["Индийский","Тихий","Средиземное море","Северный Ледовитый"],c:2},
{q:"Какая страна имеет наибольшее количество вулканов?",a:["Индонезия","Япония","Италия","Россия"],c:0},
];

// 🔀 НАСТОЯЩИЙ РАНДОМАЙЗЕР ФИШЕРА–ЙЕТСА
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

shuffle(questions);
const test = questions.slice(0, 15);

let index = 0;
let score = 0;
let time = 25;
let timer;

function showQuestion() {
    if (index >= test.length) {
        document.body.innerHTML =
        `<h2>Результат: ${score} из 15<br>Оценка: ${getGrade()}</h2>`;
        return;
    }

    document.getElementById("question").innerText =
        (index + 1) + ". " + test[index].q;

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    test[index].a.forEach((text, i) => {
        let btn = document.createElement("button");
        btn.innerText = text;
        btn.onclick = () => answer(i);
        answers.appendChild(btn);
    });

    resetTimer();
}

function answer(i) {
    if (i === test[index].c) score++;
    index++;
    showQuestion();
}

function resetTimer() {
    clearInterval(timer);
    time = 25;
    document.getElementById("time").innerText = time;

    timer = setInterval(() => {
        time--;
        document.getElementById("time").innerText = time;
        if (time === 0) {
            clearInterval(timer);
            index++;
            showQuestion();
        }
    }, 1000);
}

function getGrade() {
    if (score >= 13) return 5;
    if (score >= 10) return 4;
    if (score >= 7) return 3;
    return 2;
}

showQuestion();
</script>

</body>
</html>
